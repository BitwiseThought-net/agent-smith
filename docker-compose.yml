services:
  autoheal:
    container_name: ai-autoheal
    depends_on:
      - the-architect
    image: willfarrell/autoheal:latest
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      autoheal: "true"

  the-architect:
    container_name: the-architect
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    volumes:
      - ai_memory:/app/.crewai
      - .:/app/config_mount:ro
      - ./plugins:/app/plugins:ro
      - ./output:/app/output
#      - ./knowledge:/app/knowledge
      - /media/knowledge:/app/knowledge
    working_dir: /app
    env_file:
      - .env
    environment:
      - TEAM_CONFIG=team.json
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=.
      - OPENAI_API_BASE=${LITELLM_BASE_URL:-http://litellm:4000}
      - CHROMA_API_BASE=http://chromadb:8000
      - CREWAI_STORAGE_DIR=/app/.crewai
    depends_on:
      litellm:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: "sh -c '[ $(($(date +%s) - $(stat -c %Y /tmp/heartbeat))) -lt 300 ]'"
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 2m
    labels:
      autoheal: "true"

  tool-installer:
    container_name: ai-tool-installer
    image: python:3.12-slim
    depends_on:
      open-webui:
        condition: service_healthy
    volumes:
      - ./tools:/tools:ro
      - ./scripts/install_tools.py:/install_tools.py:ro
    env_file:
      - .env
    command: ["python", "/install_tools.py"]
    environment:
      - OPEN_WEBUI_URL=http://open-webui:8080
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
    restart: "no"

  open-webui:
    container_name: ai-open-webui
    image: ghcr.io/open-webui/open-webui:main
    restart: always
    depends_on:
      litellm:
        condition: service_healthy
      searxng:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "${UI_PORT:-8080}:8080"
    volumes:
      - ai_open_webui_data:/app/backend/data
    env_file:
      - .env
    environment:
      # Point Open WebUI at LiteLLM as if it were an OpenAI-compatible endpoint
      - OPENAI_API_BASE_URL=${LITELLM_BASE_URL:-http://litellm:4000}
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:-sk-change-me}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-this-secret}
      # Native web search feature, backed by the local SearXNG instance below.
      # This is separate from (and complementary to) the custom scraping Tool.
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  litellm:
    container_name: ai-litellm
    image: ghcr.io/berriai/litellm:main-latest
    restart: always
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      - OLLAMA_API_BASE=${OLLAMA_BASE_URL}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-change-me}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
#     command: ["--model", "ollama/${MODEL_NAME}", "--port", "4000", "--drop_params"]
    labels:
      autoheal: "true"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  searxng:
    image: searxng/searxng:latest
    container_name: ai-searxng
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
#      - ./core-config/:/etc/searxng/:Z
      - ./searxng-config/:/etc/searxng/
#      - core-data:/var/cache/searxng/
    env_file:
      - .env
    environment:
      - INSTANCE_NAME=local-searxng
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  chromadb:
    container_name: ai-chromadb
    image: chromadb/chroma:latest
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./chroma-data:/chroma/chroma
    env_file:
      - .env
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    labels:
      autoheal: "true"
    healthcheck:
      test:
        - "CMD"
        - "perl"
        - "-e"
        - "use IO::Socket::INET; my $$s = IO::Socket::INET->new(PeerAddr=>'localhost', PeerPort=>8000, Proto=>'tcp', Timeout=>5) or exit 1; print $$s \"GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n\"; my $$r = <$$s>; exit ($$r =~ /200/ ? 0 : 1);"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
#    healthcheck:
#      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && exec 3<&-"]
#      interval: 10s
#      timeout: 5s
#      retries: 10
#      start_period: 20s

  ollama:
    container_name: ai-ollama
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ai_ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    env_file:
      - .env
    entrypoint: /bin/sh -c "mkdir -p plugins && ollama serve & sleep 5 && ollama pull ${MODEL_NAME} && ollama pull nomic-embed-text && wait"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"${MODEL_NAME}\" && ollama list | grep -q nomic-embed-text"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 5m

volumes:
  ai_memory:
  ai_ollama_data:
  ai_open_webui_data:

