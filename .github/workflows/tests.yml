name: Tests

on:
  pull_request:
    branches: [main]
  # Also run on direct pushes to main, so a merge that bypasses PR review
  # (or a merge queue) still gets a signal on the resulting commit.
  push:
    branches: [main]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest -q \
            --cov=lib --cov=knowledge_manager --cov=tools --cov=loaders --cov=main \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=pytest-results.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: pytest results
          path: pytest-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: htmlcov/
          retention-days: 14

      - name: Code coverage summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          # fail_below_min is intentionally left unset (defaults to false):
          # thresholds below only color the badge/indicators, they don't fail
          # the job. Overall repo coverage currently sits around ~46%, pulled
          # down by main.py's orchestration logic and untested loaders, which
          # aren't realistically unit-testable without integration tests
          # against real CrewAI/LiteLLM/ChromaDB services.
          thresholds: "60 80"

      - name: Post coverage summary to job summary
        if: always()
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage summary as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md
