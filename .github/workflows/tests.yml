name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: 
      - '*'
    branches-ignore:
      - main
  workflow_dispatch: {}

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      checks: write
      pull-requests: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest -q \
            --cov=lib \
            --cov=knowledge_manager \
            --cov=tools \
            --cov=loaders \
            --cov=main \
            --cov=ai_io \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=pytest-results.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: pytest results
          path: pytest-results.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html-report
          path: htmlcov/
          retention-days: 14

      - name: Code coverage summary
        if: always()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: "60 80"

      - name: Post coverage summary to job summary
        if: always()
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage summary as PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          path: code-coverage-results.md

      - name: Generate coverage and test badges
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p badges
          genbadge coverage -i coverage.xml -o badges/coverage-badge.svg --local
          genbadge tests -i pytest-results.xml -o badges/tests-badge.svg --local

      - name: Commit updated badges
        if: always() && github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update coverage and test badges [skip ci]"
          file_pattern: badges/*.svg
