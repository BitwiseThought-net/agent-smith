[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra

# Full-suite runs (CI, `pytest`) are unaffected by testmon: it only changes
# behavior when its own flag is passed explicitly. For fast local iteration,
# run `pytest --testmon` (or `scripts/test-changed.sh`) to only re-run tests
# whose covered code (or test source itself) changed since the last testmon
# run. See docs/reference/testing.md.
